services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  bot:
    image: ${APP_IMAGE:-next-bot-app:latest}
    build: .
    container_name: smart-bot
    restart: always
    volumes:
      - ./sessions:/app/sessions
      - ./knowledge_base.md:/app/knowledge_base.md
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - DATABASE_PATH=sessions/smart_bot.db
    command: python3 -u main.py
    depends_on:
      - qdrant
      - redis

  api:
    image: ${APP_IMAGE:-next-bot-app:latest}
    build: .
    container_name: nextbot-api
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./sessions:/app/sessions
      - ./static:/app/static
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - DATABASE_PATH=sessions/smart_bot.db
    command: python3 -u -m uvicorn api:app --host 0.0.0.0 --port 8080
    depends_on:
      - qdrant
      - redis

